{% extends "index.html" %}

{% block title %}See available doctors{% endblock title %}

{% block content %}
  <table>
    <thead>
      <th>Name</th>
    </thead>
    <tbody>
      {% for doctor in object_list %}
        <tr>
          <td>{{ doctor.full_name|title }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="{% url "create" %}">Hire a new doctor</a>
{% endblock content %}
