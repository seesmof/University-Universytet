{% extends "index.html" %}

{% block title %}{{ measurement|title }} details{% endblock title %}

{% block content %}
  <h1 class="font-bold text-3xl pt-4">Measurement called {{ measurement.value }}</h1>
  <p class="py-4">{{ measurement.description }}</p>

  <a class="cursor-pointer text-stone-300" href="{% url 'list' %}">Show all measurements</a>
{% endblock content %}
