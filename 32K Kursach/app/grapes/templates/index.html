<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grapes</title>
  </head>
  <body>
    {% if bunches %}
    <ul>
      {% for bunch in bunches %}
      <li><a href="{% url 'grapes:bunch' bunch.id %}">{{ bunch.count }}</a></li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No grapes found</p>
    {% endif %}
  </body>
</html>
