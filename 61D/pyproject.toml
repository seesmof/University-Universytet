[project]
name = "farm-manager"
version = "0.1.0"
description = "Small farm management app (Streamlit + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57",
    "pandas",
    "peewee>=4.5.1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
show_error_codes = true
