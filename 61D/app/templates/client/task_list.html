{% extends "index.html" %}
{% block title %}Задачі{% endblock title %}
{% block content %}
<a href="{% url "index" %}">Додому</a>
<h1>Задачі</h1>
<table>
  <thead></thead>
  <tbody>
    {% for task in object_list %}
    <tr>
      <td>{{ task.name }}</td>
      <td>{{ task.description }}</td>
      <td>{{ task.due }}</td>
      <td>{{ task.created_at }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock content %}
